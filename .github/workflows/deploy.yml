name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '31.97.180.176' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD || '3,VUkqGrDeCT8D0G' }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            echo "=== [GitHub Actions CI/CD] Starting VPS Deployment ==="
            cd /opt/ai-story-harness
            
            # Initialize git repo if not already tracked
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/zubaerisla-create/ai-harness-video-generator.git || true
            fi

            # Pull latest changes from main branch
            git fetch origin main
            git reset --hard origin/main
            
            # Execute deployment script
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
            echo "=== [GitHub Actions CI/CD] Deployment Finished Successfully ==="
