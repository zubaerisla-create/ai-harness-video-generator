version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../outputs:/opt/ai-story-harness/outputs
      - ../models:/opt/ai-story-harness/models
      - ../backend/data:/opt/ai-story-harness/backend/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HOST=0.0.0.0
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
