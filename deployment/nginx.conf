# Example Nginx Reverse Proxy Configuration for AI Story Harness
# Place in /etc/nginx/sites-available/ai-story-harness and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name story.yourdomain.com; # Replace with your domain or VPS IP

    client_max_body_size 100M;

    # Protect internal endpoints and stream downloads
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets and long-running SSE support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Video streaming optimizations
    location /api/videos/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}
